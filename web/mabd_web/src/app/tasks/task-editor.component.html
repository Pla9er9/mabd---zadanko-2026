<mat-card class="editor-card">
  <mat-card-title>{{ task ? 'Edytuj zadanie' : 'Nowe zadanie' }}</mat-card-title>
  <mat-card-content>
    <div class="loading" *ngIf="isLoading">Ładowanie zadania...</div>

    <form class="editor-form" [formGroup]="form" (ngSubmit)="save()" *ngIf="!isLoading">
      <mat-form-field appearance="fill">
        <mat-label>Tytuł</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Opis</mat-label>
        <textarea matInput rows="4" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status">{{ status }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Kategoria</mat-label>
        <input matInput formControlName="category" />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Termin</mat-label>
        <input matInput type="date" formControlName="dueDate" />
      </mat-form-field>

      <div class="editor-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">Zapisz</button>
        <a mat-button routerLink="/tasks">Anuluj</a>
      </div>
    </form>
    <div class="feedback" *ngIf="feedback">{{ feedback }}</div>
  </mat-card-content>
</mat-card>
