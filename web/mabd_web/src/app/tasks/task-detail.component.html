<div class="loading" *ngIf="isLoading">Ładowanie zadania...</div>
<div class="feedback" *ngIf="feedback">{{ feedback }}</div>

<ng-container *ngIf="!isLoading && task; else missingTask">
  <mat-card class="detail-card">
    <mat-card-title>
      {{ task.title }}
      <span class="status-pill" [class.done]="task.isDone">{{ task.status }}</span>
    </mat-card-title>
    <mat-card-subtitle>
      <span class="category-pill">{{ task.category }}</span>
      <span>Termin: {{ task.dueDate | date:'longDate' }}</span>
    </mat-card-subtitle>
    <mat-divider></mat-divider>
    <mat-card-content>
      <p>{{ task.description || 'Brak opisu.' }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button type="button" (click)="toggleDone()">
        {{ task.isDone ? 'Oznacz jako otwarte' : 'Oznacz jako wykonane' }}
      </button>
      <a mat-flat-button color="primary" [routerLink]="['/tasks', task.id, 'edit']">Edytuj</a>
      <button mat-button color="warn" type="button" (click)="deleteTask()">Usuń</button>
      <a mat-button color="accent" routerLink="/tasks">Powrót</a>
    </mat-card-actions>
  </mat-card>
</ng-container>

<ng-template #missingTask>
  <mat-card *ngIf="!isLoading && !task">
    <mat-card-content>Nie odnaleziono zadania.</mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/tasks">Powrót do listy</a>
    </mat-card-actions>
  </mat-card>
</ng-template>
